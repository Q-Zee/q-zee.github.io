<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .bank { fill: #f5f0e6; stroke: #8a7a5c; stroke-width: 2; }
    .river { fill: #cfe8f5; }
    .item { font-size: 22px; }
    .label { font-size: 13px; fill: #444; }
    .step-label { font-size: 12px; fill: #666; text-anchor: middle; }
    .arrow { stroke: #2b6cb0; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .boat { fill: #8a5a2b; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- Left bank -->
  <rect x="20" y="30" width="220" height="260" class="bank" rx="8"/>
  <text x="130" y="20" text-anchor="middle" class="label" font-weight="bold">Left bank (start)</text>
  <text x="60" y="90" class="item">🐺 Wolf</text>
  <text x="60" y="130" class="item">🥬 Cabbage</text>
  <text x="60" y="170" class="item">🐐 Goat</text>
  <text x="60" y="230" class="item">🧑 Farmer</text>

  <!-- River -->
  <rect x="240" y="30" width="200" height="260" class="river"/>
  <text x="340" y="20" text-anchor="middle" class="label" font-weight="bold">River</text>
  <g transform="translate(300,150)">
    <rect x="0" y="0" width="80" height="26" rx="4" class="boat"/>
    <text x="40" y="18" text-anchor="middle" class="item" font-size="16" fill="#fff">⛵ 🐐</text>
  </g>
  <path class="arrow" d="M260,110 C320,80 360,80 420,110"/>
  <text x="340" y="70" class="step-label">Step 1: Farmer takes Goat across</text>

  <!-- Right bank -->
  <rect x="440" y="30" width="220" height="260" class="bank" rx="8"/>
  <text x="550" y="20" text-anchor="middle" class="label" font-weight="bold">Right bank (goal)</text>
  <text x="480" y="230" class="item">🐐 Goat</text>
  <text x="480" y="270" class="item">🧑 Farmer</text>

  <!-- Legend / model note -->
  <g transform="translate(690,40)">
    <rect x="0" y="0" width="190" height="230" fill="#fff" stroke="#ccc" rx="6"/>
    <text x="10" y="24" font-weight="bold" font-size="13">Model in one line</text>
    <text x="10" y="48" font-size="12" fill="#333">4 binary variables</text>
    <text x="10" y="66" font-size="12" fill="#333">(Wolf, Goat, Cabbage,</text>
    <text x="10" y="84" font-size="12" fill="#333">Farmer) × N trip steps.</text>
    <text x="10" y="112" font-size="12" fill="#333">0 = left bank</text>
    <text x="10" y="130" font-size="12" fill="#333">1 = right bank</text>
    <text x="10" y="158" font-size="12" fill="#333">Constraints forbid</text>
    <text x="10" y="176" font-size="12" fill="#333">Wolf+Goat or Goat+</text>
    <text x="10" y="194" font-size="12" fill="#333">Cabbage unattended.</text>
    <text x="10" y="218" font-size="12" fill="#333">CQM finds the trips.</text>
  </g>
</svg>
